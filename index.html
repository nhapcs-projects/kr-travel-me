<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hàn Quốc 3–10/10/2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Lịch trình Seoul và Busan, 3–10/10/2026, 2 người.">
<meta property="og:title" content="Seoul / Busan — 3–10/10/2026">
<meta property="og:description" content="Lịch trình 7 đêm trên bản đồ, chi phí theo ngày, quãng đường.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.9.0/maplibre-gl.css">

<style>
  :root{
    --paper:#EFF0EA; --card:#FFFFFF; --ink:#18222E; --ink-soft:#5C6674; --ink-faint:#8B95A1;
    --seoul:#27406E; --seoul-wash:#DEE3EE; --busan:#0E6A61; --busan-wash:#D6E6E2;
    --alert:#A32E44; --alert-wash:#F4DFE3; --warn:#8A6D1F; --warn-wash:#F5EEDA; --ok:#2A6B45;
    --rule:#D5D7CF; --rule-soft:#E6E7E1;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
    --side:400px;
    --shadow:0 2px 10px rgba(24,34,46,.13);
    --shadow-lg:0 -6px 28px rgba(24,34,46,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit}

  /* =============== KHUNG =============== */
  .app{display:grid;grid-template-columns:var(--side) 1fr;height:100dvh}
  .side{grid-column:1;grid-row:1}
  .stage{grid-column:2;grid-row:1}

  .side{
    display:flex;flex-direction:column;min-height:0;min-width:0;
    background:var(--paper);border-right:1px solid var(--rule);z-index:10;
  }
  .grip{display:none}

  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
  .brand h1{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.05}
  .brand h1 .sep{color:var(--ink-faint);font-weight:400}
  .brand .kick{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:5px 0 0}

  .tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--rule);background:var(--paper)}
  .tabs button{
    flex:1;min-width:0;background:none;border:0;border-bottom:2px solid transparent;
    font-size:13px;padding:7px 2px 8px;cursor:pointer;color:var(--ink-faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

  .panes{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
  .pane{display:none;padding:12px 12px 40px}
  .pane.on{display:block}
  .pane h2{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
    margin:20px 4px 8px;
  }
  .pane h2:first-child{margin-top:4px}

  /* =============== SÂN KHẤU BẢN ĐỒ =============== */
  .stage{position:relative;min-width:0;background:#E8EAE4}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px}

  .daybar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;gap:6px;padding:12px 12px 22px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,rgba(239,240,234,.92) 0%,rgba(239,240,234,.72) 55%,transparent 100%);
  }
  .daybar::-webkit-scrollbar{display:none}
  .daybar button{
    flex:0 0 auto;background:var(--card);border:1px solid var(--rule);border-radius:20px;
    padding:6px 13px;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);
  }
  .daybar button i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .daybar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .daybar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .mapfoot{
    position:absolute;left:12px;bottom:12px;z-index:5;max-width:calc(100% - 24px);
    background:var(--card);border:1px solid var(--rule);border-radius:8px;
    box-shadow:var(--shadow);padding:9px 13px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
    display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  }
  .mapfoot b{font-weight:500;color:var(--ink)}
  .mapfoot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule)}
  .mapfoot a:hover{color:var(--ink);border-bottom-color:var(--ink)}

  .layerbar{
    position:absolute;top:46px;left:0;right:0;z-index:5;
    display:flex;gap:6px;padding:0 12px;pointer-events:none;
  }
  .layerbar button{
    pointer-events:auto;background:var(--card);border:1px solid var(--rule);border-radius:20px;
    padding:4px 11px;font-size:12px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink-faint);
    display:inline-flex;align-items:center;gap:6px;
  }
  .layerbar button::before{
    content:"";width:9px;height:9px;border-radius:2px;border:1.5px solid currentColor;flex:0 0 auto;
  }
  .layerbar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .layerbar button[aria-pressed="true"]::before{background:currentColor}
  .layerbar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .stn{
    min-width:19px;height:19px;padding:0 4px;border-radius:5px;background:#2F3B4A;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;white-space:nowrap;
    font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:-.02em;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .stn:hover{transform:scale(1.2)}
  .plc{
    width:22px;height:22px;border-radius:50%;background:#C2761F;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);transition:transform .14s ease;
  }
  .plc:hover{transform:scale(1.22)}

  .htl{
    width:27px;height:27px;border-radius:7px;background:#A32E44;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45);transition:transform .14s ease;
  }
  .htl:hover{transform:scale(1.18)}
  .htl svg{width:15px;height:15px;display:block}
  .htl.soon{background:#fff;border:2.5px dashed #A32E44}
  .htl.soon svg{fill:#A32E44}

  .tiles-warn{
    position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:6;
    background:var(--warn-wash);color:var(--warn);border:1px solid #E2D5AE;
    border-radius:20px;padding:5px 14px;font-size:12px;box-shadow:var(--shadow);display:none;
  }
  .tiles-warn.on{display:block}

  /* =============== ĐIỂM TRÊN BẢN ĐỒ =============== */
  .pin{
    width:25px;height:25px;border-radius:50%;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;font-weight:500;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);
    transition:transform .14s ease;
  }
  .pin:hover{transform:scale(1.18)}
  .pin.sel{transform:scale(1.3);box-shadow:0 0 0 4px rgba(24,34,46,.22),0 1px 5px rgba(0,0,0,.4)}

  .maplibregl-popup-content{
    border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);font-family:var(--sans);
  }
  .pop b{display:block;font-size:14.5px;letter-spacing:-.01em;margin-bottom:2px}
  .pop .pt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);display:block;margin-bottom:6px}
  .pop p{margin:0 0 8px;font-size:13px;color:var(--ink-soft)}
  .pop .pl{display:flex;flex-wrap:wrap;gap:9px;font-size:12.5px}
  .pop .pl a,.pop .pl button{
    color:var(--seoul);text-decoration:none;border:0;border-bottom:1px solid rgba(39,64,110,.4);
    background:none;font-size:12.5px;padding:0 0 1px;cursor:pointer;
  }

  /* =============== LỊCH TRONG SIDEBAR =============== */
  .day{background:var(--card);border:1px solid var(--rule);border-radius:7px;margin-bottom:8px;overflow:hidden}
  .day.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .dhead{
    width:100%;display:block;text-align:left;background:none;border:0;cursor:pointer;
    padding:11px 13px;border-left:4px solid var(--seoul);
  }
  .day[data-city="busan"] .dhead{border-left-color:var(--busan)}
  .day[data-city="s2b"] .dhead,.day[data-city="b2s"] .dhead{border-left-color:#7A5AA8}
  .dhead:hover{background:#FAFBF8}
  .dhead:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .dhead .dt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);display:block}
  .dhead .dn{font-size:15.5px;font-weight:700;letter-spacing:-.02em;display:block;margin:1px 0 0}
  .dhead .dc{
    display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;
    font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  }
  .dhead .dc span{background:#F2F3EE;border-radius:12px;padding:2px 7px}
  .dhead .ar{float:right;color:var(--ink-faint);font-size:11px;margin-top:2px}

  .dbody{display:none;padding:0 13px 13px;border-top:1px solid var(--rule-soft)}
  .day.open .dbody{display:block}

  .stop{
    display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule-soft);cursor:pointer;
    scroll-margin-top:10px;
  }
  .stop:first-child{border-top:0}
  .stop .tm{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);flex:0 0 40px;padding-top:2px}
  .stop .bd{flex:1;min-width:0}
  .stop .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;gap:7px;align-items:baseline}
  .stop .num{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;color:#fff;
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;align-self:center;
  }
  .stop .ds{display:none;font-size:13px;color:var(--ink-soft);margin:5px 0 0}
  .stop.open .ds{display:block}
  .stop.hit{background:var(--warn-wash);border-radius:5px;box-shadow:0 0 0 5px var(--warn-wash)}
  .stop .lk{display:none;flex-wrap:wrap;gap:11px;margin-top:7px}
  .stop.open .lk{display:flex}
  .stop .lk a,.stop .lk button{
    font-size:12px;color:var(--seoul);text-decoration:none;background:none;border:0;
    border-bottom:1px solid rgba(39,64,110,.35);padding:0 0 1px;cursor:pointer;
  }
  .day[data-city="busan"] .stop .lk a,.day[data-city="busan"] .stop .lk button{color:var(--busan);border-bottom-color:rgba(14,106,97,.35)}

  .leg{
    display:flex;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
    padding:1px 0;
  }
  .leg .sp{flex:0 0 40px;text-align:right}
  .leg.tight{color:var(--alert)}
  .leg.ks{color:#9A6B7A;font-style:italic}
  .leg .go{
    display:block;font-family:var(--sans);font-style:normal;font-size:12px;
    line-height:1.45;color:var(--ink-soft);margin:3px 0 2px;
  }
  .leg.ks .go{color:#8A6472}
  .leg{align-items:flex-start;padding:3px 0}
  .leg .sp{padding-top:1px}
  .dhead .dc span.ks{background:#F6EBEE;color:#8A5A68}

  .note{background:var(--seoul-wash);border-radius:5px;padding:9px 11px;font-size:12.5px;color:var(--ink-soft);margin-top:9px}

  /* =============== KHỐI CHUNG =============== */
  .box{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:12px 14px;margin-bottom:8px}
  .box p{margin:0 0 7px;font-size:13.5px;color:var(--ink-soft)}
  .box p:last-child{margin-bottom:0}
  .box .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .box .hd b{font-size:15px;letter-spacing:-.02em}
  .box .hd span{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .box.best{border-left:3px solid var(--busan)}
  .lk-row{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px}
  .lk-row a{font-size:12px;color:var(--seoul);text-decoration:none;border-bottom:1px solid rgba(39,64,110,.35);padding-bottom:1px}

  .task{
    display:flex;gap:11px;align-items:flex-start;background:var(--card);
    border:1px solid var(--rule);border-radius:7px;padding:11px 13px;margin-bottom:7px;cursor:pointer;
  }
  .task.urgent{border-left:3px solid var(--alert)}
  .task input{
    appearance:none;width:18px;height:18px;flex:0 0 18px;margin:2px 0 0;
    border:1.5px solid var(--ink-faint);border-radius:4px;background:#fff;cursor:pointer;position:relative;
  }
  .task input:checked{background:var(--ink);border-color:var(--ink)}
  .task input:checked::after{
    content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
  }
  .task .t{font-weight:600;font-size:14px;display:block;letter-spacing:-.01em}
  .task .d{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:2px}
  .task .due{
    font-family:var(--mono);font-size:10px;color:var(--alert);background:var(--alert-wash);
    padding:2px 7px;border-radius:3px;display:inline-block;margin-top:6px;
  }
  .task.done{opacity:.45}
  .task.done .t{text-decoration:line-through}
  .prog{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:10px 4px 0}

  /* =============== TIỀN =============== */
  .rate{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);
    border:1px solid var(--rule);border-radius:7px;padding:10px 13px;margin-bottom:9px;
    font-size:12.5px;color:var(--ink-soft);
  }
  .rate input{
    font-family:var(--mono);font-size:12.5px;width:84px;text-align:right;padding:4px 7px;
    border:1px solid var(--rule);border-radius:4px;background:#fff;color:inherit;
  }
  .rate button{
    margin-left:auto;font-size:12px;color:var(--ink-faint);background:none;border:0;
    border-bottom:1px solid var(--rule);cursor:pointer;padding:0 0 1px;
  }
  .brow{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:10px 13px;margin-bottom:7px}
  .brow.tot{border:2px solid var(--ink);background:#F7F8F4}
  .brow .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .brow .r1 b{font-size:14px;letter-spacing:-.01em}
  .brow .r1 .est{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .brow .sub{font-size:12px;color:var(--ink-faint);margin-top:1px}
  .brow .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .brow .r2 label{font-size:12.5px;color:var(--ink-soft)}
  .brow .r2 input{
    font-family:var(--mono);font-size:12.5px;width:100px;text-align:right;padding:4px 7px;
    border:1px solid var(--rule);border-radius:4px;background:#fff;color:inherit;
  }
  .brow .vd{font-family:var(--mono);font-size:11.5px;margin-left:auto;color:var(--ink-faint)}
  .brow .vd.over{color:var(--alert)} .brow .vd.under{color:var(--ok)}
  .cost{margin-top:10px;border:1px solid var(--rule-soft);border-radius:5px;overflow:hidden}
  .cost .ch{display:flex;justify-content:space-between;gap:10px;background:#F7F8F4;padding:7px 11px;font-size:12.5px;font-weight:600}
  .cost .ch span:last-child{font-family:var(--mono);font-weight:400}
  .cost ul{margin:0;padding:6px 11px 9px;list-style:none}
  .cost li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-soft);padding:2px 0}
  .cost li span:last-child{font-family:var(--mono);white-space:nowrap}

  details.nt{margin-top:9px}
  details.nt summary{font-size:12px;color:var(--ink-faint);cursor:pointer;list-style:none;padding:4px 0}
  details.nt summary::-webkit-details-marker{display:none}
  details.nt summary::before{content:"+ ";font-family:var(--mono)}
  details.nt[open] summary::before{content:"− "}
  details.nt textarea{
    width:100%;min-height:64px;font-family:inherit;font-size:13px;line-height:1.5;padding:9px 10px;
    border:1px solid var(--rule);border-radius:5px;background:#FCFDFB;color:inherit;resize:vertical;
  }

  /* =============== KIỂM TRA + LƯU Ý =============== */
  .chk{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:11px 13px;margin-bottom:8px}
  .chk .w{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:10px;margin-right:7px}
  .chk .lv-err{background:var(--alert-wash);color:var(--alert)}
  .chk .lv-warn{background:var(--warn-wash);color:var(--warn)}
  .chk .lv-ok{background:#E4EFE8;color:var(--ok)}
  .chk p{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}
  .ni{padding:11px 0;border-top:1px solid var(--rule)}
  .ni:first-child{border-top:0;padding-top:0}
  .ni h3{font-size:13.5px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
  .ni p{margin:0;font-size:13px;color:var(--ink-soft)}
  .ni a,.fine a{color:var(--seoul)}
  .fine{font-size:11.5px;color:var(--ink-faint);margin:10px 4px 0;line-height:1.6}

  .status{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
    background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;
    padding:7px 15px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;z-index:9999;
  }
  .status.show{opacity:1;transform:translate(-50%,0)}

  /* =============== MOBILE: TẤM KÉO =============== */
  @media (max-width:820px){
    .app{display:block;position:relative;height:100dvh}
    .side,.stage{grid-column:auto;grid-row:auto}
    .stage{position:absolute;inset:0}
    .daybar{padding:10px 10px 26px}
    .mapfoot{left:10px;bottom:auto;top:56px;font-size:11px;padding:7px 11px}

    .side{
      position:absolute;left:0;right:0;bottom:0;top:auto;height:88dvh;
      border-right:0;border-radius:15px 15px 0 0;box-shadow:var(--shadow-lg);
      z-index:20;transition:transform .3s cubic-bezier(.32,.72,0,1);
      transform:translateY(calc(88dvh - 132px));
      touch-action:none;
    }
    .side.half{transform:translateY(46dvh)}
    .side.full{transform:translateY(0)}
    .side.drag{transition:none}
    .grip{
      display:block;padding:9px 0 5px;cursor:grab;flex:0 0 auto;
      touch-action:none;background:var(--paper);border-radius:15px 15px 0 0;
    }
    .grip i{display:block;width:38px;height:4px;border-radius:3px;background:var(--ink-faint);opacity:.45;margin:0 auto}
    .brand{padding:2px 16px 10px}
    .brand h1{font-size:19px}
    .panes{touch-action:pan-y}
    .side:not(.full) .panes{overflow:hidden}
    .status{bottom:auto;top:64px}
  }
</style>

<div class="app">

  <main class="stage">
    <div class="daybar" id="daybar"></div>
    <div class="layerbar" id="layerbar">
      <button data-layer="stations" aria-pressed="false">Ga metro</button>
      <button data-layer="places" aria-pressed="false">Địa điểm khác</button>
    </div>
    <div id="map"></div>
    <div class="tiles-warn" id="tiles-warn">Bản đồ vector không tải được — đang dùng bản dự phòng</div>
    <div class="mapfoot"><span id="mapsum"></span><span id="mapout"></span></div>
  </main>

  <aside class="side" id="side">
    <div class="grip" id="grip"><i></i></div>

(function(){
'use strict';

/* ------------------------------------------------------- tiện ích số */
const nf   = n => Math.round(n).toLocaleString('vi-VN');
const krw  = n => nf(n) + '₩';
const krwR = r => r[0] === r[1] ? krw(r[0]) : nf(r[0]) + '–' + krw(r[1]);
const trieu= n => (n/1e6).toFixed(1).replace('.', ',') + ' triệu';
const toMin= t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
const fmtMin=m => m < 60 ? Math.round(m) + "'" : Math.floor(m/60) + 'h' + String(Math.round(m%60)).padStart(2,'0');
const km1  = k => k.toFixed(1).replace('.', ',') + ' km';

/* --------------------------------------------------- quãng đường/giờ */
const DETOUR = 1.3;
function hav(a, b){
  const R = 6371, rad = d => d*Math.PI/180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estMin(straightKm){
  if (straightKm > 40) return null;
  const km = straightKm*DETOUR;
  if (km < 1.5) return km/4.5*60;
  if (km <= 8)  return km/14*60 + 8;
  return km/25*60 + 10;
}
const mapped = day => day.stops.filter(s => typeof s.lat === 'number' && typeof s.lng === 'number');
function dayLegs(day){
  const p = mapped(day), out = [];
  for (let i = 0; i < p.length - 1; i++){
    const straight = hav(p[i], p[i+1]);
    out.push({ from:p[i], to:p[i+1], straight, km:straight*DETOUR, min:estMin(straight) });
  }
  return out;
}
const dayKm      = day => dayLegs(day).reduce((s,l) => s + l.km, 0);
const dayMoveMin = day => dayLegs(day).reduce((s,l) => s + (l.min || 0), 0);

/* Hai chặng không nằm trong danh sách điểm nhưng ngày nào cũng phải đi:
   từ chỗ ngủ ra điểm đầu tiên, và từ điểm cuối về chỗ ngủ. Trước đây bị
   bỏ sót hoàn toàn — riêng ngày 6/10 khiến con số hụt hơn ba lần. */
const hotelBy = name => name ? (TRIP.hotels || []).find(h => h.name === name) || null : null;
function hotelLegs(day){
  const p = mapped(day);
  if (!p.length) return [];
  const out = [];
  const add = (kind, a, b, label) => {
    const straight = hav(a, b);
    if (straight * DETOUR < 0.15) return;          // trùng chỗ, bỏ qua
    out.push({ kind, a, b, label, straight, km:straight*DETOUR, min:estMin(straight) });
  };
  const w = hotelBy(day.wake), sl = hotelBy(day.sleep);
  if (w)  add('from', w, p[0], w.name);
  if (sl) add('to', p[p.length-1], sl, sl.name);
  return out;
}
const dayHotelKm = day => hotelLegs(day).reduce((s,l) => s + l.km, 0);
const dayTotalKm = day => dayKm(day) + dayHotelKm(day);

/* -------------------------------------------------------------- tiền */
function costRange(c, rate){
  if (c.text != null) return null;
  if (c.vnd != null){
    const v = Array.isArray(c.vnd) ? c.vnd : [c.vnd, c.vnd];
    return [v[0]/rate*1000, v[1]/rate*1000];
  }
  if (c.krw == null) return null;
  const k = Array.isArray(c.krw) ? c.krw : [c.krw, c.krw];
  return [k[0], k[1]];
}
function costText(c, rate){
  if (c.text != null) return c.text;
  if (c.vnd != null){
    const v = Array.isArray(c.vnd) ? c.vnd : [c.vnd, c.vnd];
    const r = costRange(c, rate);
    return (v[0] === v[1] ? nf(v[0]) : nf(v[0]) + '–' + nf(v[1])) + '₫ ≈ '
         + krwR([Math.round(r[0]/1000)*1000, Math.round(r[1]/1000)*1000]);
  }
  const k = Array.isArray(c.krw) ? c.krw : [c.krw, c.krw];
  return krwR(k);
}
function dayBudget(day, rate){
  let lo = 0, hi = 0;
  (day.costs || []).forEach(c => { const r = costRange(c, rate); if (r){ lo += r[0]; hi += r[1]; } });
  return [Math.round(lo/1000)*1000, Math.round(hi/1000)*1000];
}

const enc = encodeURIComponent;
const term     = s => s.q || s.name;
const uNaver   = s => 'https://map.naver.com/p/search/' + enc(term(s));
const uKakaoTo = s => 'https://map.kakao.com/link/to/' + enc(term(s)) + ',' + s.lat + ',' + s.lng;
const uRead    = q => 'https://www.google.com/search?hl=vi&q=' + enc(q);
function uGoogleDay(day){
  const p = mapped(day);
  if (p.length < 2) return null;
  const co = s => s.lat + ',' + s.lng;
  let u = 'https://www.google.com/maps/dir/?api=1&hl=vi&origin=' + co(p[0])
        + '&destination=' + co(p[p.length-1]) + '&travelmode=transit';
  const mid = p.slice(1, -1);
  if (mid.length) u += '&waypoints=' + mid.slice(0, 9).map(co).join('|');
  return u;
}

const KEY = 'trip-korea-oct2026';
const state = { checks:{}, notes:{}, spend:{}, rate:TRIP.rate, layers:{ stations:false, places:false } };

const store = (function(){
  try{
    if (window.storage && typeof window.storage.get === 'function'){
      return { mode:'shared',
        get:() => window.storage.get(KEY, true).then(r => r && r.value ? r.value : null),
        set:v  => window.storage.set(KEY, v, true) };
    }
  }catch(e){}
  try{
    window.localStorage.setItem('__probe__','1');
    window.localStorage.removeItem('__probe__');
    return { mode:'local',
      get:() => Promise.resolve(window.localStorage.getItem(KEY)),
      set:v  => { window.localStorage.setItem(KEY, v); return Promise.resolve(); } };
  }catch(e){}
  let mem = null;
  return { mode:'memory', get:() => Promise.resolve(mem), set:v => { mem = v; return Promise.resolve(); } };
})();

function readQ(s){
  if (s.read) return s.read;
  if (s.q) return s.q + ' kinh nghiệm du lịch';

}

function stopLinks(day, s, mi){
  const out = [];
  const rq = readQ(s);
  if (rq) out.push('<a href="' + uRead(rq) + '" target="_blank" rel="noopener">Bài viết</a>');
  if (mi >= 0){
    out.push('<a href="' + uNaver(s) + '" target="_blank" rel="noopener">Naver</a>');

function paintSpend(){

    if (document.activeElement !== i) i.value = (typeof v === 'number' && !isNaN(v)) ? v : '';
  });
  TRIP.days.forEach(day => {
    const b = dayBudget(day, state.rate), v = state.spend[day.d];
    $$('[data-verdict="' + day.d + '"]').forEach(sp => {
      if (typeof v !== 'number' || isNaN(v)){ sp.textContent = ''; sp.className = 'vd'; return; }

      else if (v < b[0]){ sp.textContent = 'dưới ' + krw(b[0] - v); sp.className = 'vd under'; }
      else { sp.textContent = 'trong dự kiến'; sp.className = 'vd under'; }
    });
  });
}

function runChecks(){
  const out = [];
  const add = (lv, d, text) => out.push({ lv, d, text });
  TRIP.days.forEach(day => {
    const s = day.stops;
    for (let i = 1; i < s.length; i++){
      const a = toMin(s[i-1].t), b = toMin(s[i].t);
      if (b < a)   add('err',  day, 'giờ đi lùi — <b>' + s[i].t + ' ' + s[i].name + '</b> đứng sau <b>' + s[i-1].t + ' ' + s[i-1].name + '</b>.');
      if (b === a) add('warn', day, 'hai việc trùng giờ <b>' + s[i].t + '</b>: ' + s[i-1].name + ' và ' + s[i].name + '.');
    }
    dayLegs(day).forEach(l => {
      if (l.min == null) return;
      const gap = toMin(l.to.t) - toMin(l.from.t);
      if (gap <= 0) return;
      if (gap < l.min*0.7)
        add('err', day, '<b>' + l.from.name + ' → ' + l.to.name + '</b> khoảng ' + km1(l.km)
          + ', ước lượng ~' + fmtMin(l.min) + ' nhưng lịch chỉ chừa ' + fmtMin(gap) + '. Nhiều khả năng không kịp.');
      else if (gap < l.min)
        add('warn', day, '<b>' + l.from.name + ' → ' + l.to.name + '</b> khoảng ' + km1(l.km)
          + ', ước lượng ~' + fmtMin(l.min) + ' mà chỉ chừa ' + fmtMin(gap) + '. Sát giờ.');
    });
    s.forEach(st => {
      const hl = typeof st.lat === 'number', hg = typeof st.lng === 'number';
      if (hl !== hg) add('err', day, '<b>' + st.name + '</b> chỉ có một nửa toạ độ.');
      if (!/^\d{1,2}:\d{2}$/.test(st.t)) add('err', day, '<b>' + st.name + '</b> giờ không hợp lệ: “' + st.t + '”.');
    });
    if (!day.costs || !day.costs.length) add('warn', day, 'chưa có khoản chi nào.');
  });

  const box = el('checks'); if (!box) return;
  if (!out.length){
    box.innerHTML = '<div class="chk"><span class="w lv-ok">OK</span>Không thấy vấn đề gì'
      + '<p>Giờ giấc tăng dần, không trùng, mọi chặng đều đủ thời gian di chuyển theo ước lượng.</p></div>';
    return;
  }
  box.innerHTML = out.map(o =>
      '<div class="chk"><span class="w lv-' + o.lv + '">' + (o.lv === 'err' ? 'SỬA' : 'XEM') + '</span>'
    + '<b style="font-size:13px">' + o.d.date + '</b><p>' + o.text + '</p></div>').join('');
}

function stopsFor(which){
  return which === 'all' ? TRIP.days : TRIP.days.filter(d => d.d === +which);
}

function routeGeoJSON(which){
  const f = [];
  stopsFor(which).forEach(day => {
    const p = mapped(day);
    if (p.length > 1){
      f.push({ type:'Feature', properties:{ kind:'trip', color:day.color, w: which === 'all' ? 2 : 3.5 },
               geometry:{ type:'LineString', coordinates:p.map(x => [x.lng, x.lat]) } });
    }
    hotelLegs(day).forEach(l => {
      f.push({ type:'Feature', properties:{ kind:'hotel', color:day.color },
               geometry:{ type:'LineString', coordinates:[[l.a.lng, l.a.lat], [l.b.lng, l.b.lat]] } });
    });
  });
  return { type:'FeatureCollection', features:f };
}

function addRouteLayer(){
  if (map.getSource('routes')) return;
  map.addSource('routes', { type:'geojson', data: routeGeoJSON(sel) });
  // line-dasharray không nhận biểu thức theo dữ liệu, nên phải tách làm hai lớp
  map.addLayer({ id:'routes-hotel', type:'line', source:'routes',
    filter:['==', ['get','kind'], 'hotel'],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':['get','color'], 'line-width':1.6,
            'line-opacity':.42, 'line-dasharray':[0.6, 2.4] } });
  map.addLayer({ id:'routes-line', type:'line', source:'routes',
    filter:['==', ['get','kind'], 'trip'],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color':['get','color'], 'line-width':['get','w'],
            'line-opacity':.65, 'line-dasharray':[1.6, 1.6] } });
}

function clearMarkers(){
  Object.keys(markers).forEach(k => { markers[k].remove(); delete markers[k]; });
}

const BED = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">'
  + '<path d="M3 8a1 1 0 0 0-1 1v10h2.2v-2.4h15.6V19H22v-5.6a3 3 0 0 0-3-3h-7.6v4.2H4.2V9a1 1 0 0 0-1.2-1z"/>'
  + '<circle cx="7.6" cy="11.9" r="2.3"/></svg>';

/* Nhãn ngắn trên chấm ga: rút số tuyến ra để nhìn là biết đi tuyến nào.
   'Tuyến 1 · 2' -> "1·2"   'Tuyến 3' -> "3"   'AREX' -> "A"   'KTX' -> "K" */
function lineBadge(line){
  const nums = (line.match(/\d+/g) || []).slice(0, 2);
  if (nums.length) return nums.join('·');
  if (/AREX/i.test(line)) return 'A';
  if (/KTX/i.test(line))  return 'K';
  return 'M';
}

/* ---- lớp phụ: ga metro + địa điểm ngoài lịch (bật/tắt riêng) ---- */
let extra = [];
function clearExtra(){ extra.forEach(m => m.remove()); extra = []; }

function drawExtra(){
  clearExtra();
  if (!map || !styleReady) return;

  if (state.layers.stations){
    (TRIP.stations || []).forEach(st => {
      const d = document.createElement('div');
      d.className = 'stn';
      d.textContent = lineBadge(st.line);
      d.title = st.name + ' · ' + st.line;
      const html = '<div class="pop"><b>' + st.name + ' <span style="font-weight:400;color:var(--ink-faint)">' + st.ko + '</span></b>'
        + '<span class="pt">' + st.line + '</span>'
        + (st.tip ? '<p>' + st.tip + '</p>' : '')
        + '<span class="pl"><a href="' + uNaver(st) + '" target="_blank" rel="noopener">Naver</a>'
        + '<a href="' + uKakaoTo(st) + '" target="_blank" rel="noopener">Chỉ đường</a></span></div>';
      extra.push(new maplibregl.Marker({ element:d })
        .setLngLat([st.lng, st.lat])
        .setPopup(new maplibregl.Popup({ offset:15, closeButton:false, maxWidth:'270px' }).setHTML(html))
        .addTo(map));
    });
  }

  if (state.layers.places){
    (TRIP.places || []).forEach(pl => {
      const d = document.createElement('div');
      d.className = 'plc';
      d.textContent = '\u2605';
      d.title = pl.name;
      const html = '<div class="pop"><b>' + pl.name + '</b>'
        + '<span class="pt">' + pl.city + ' · không có trong lịch</span>'
        + (pl.tip ? '<p>' + pl.tip + '</p>' : '')
        + '<span class="pl"><a href="' + uNaver(pl) + '" target="_blank" rel="noopener">Naver</a>'
        + '<a href="' + uKakaoTo(pl) + '" target="_blank" rel="noopener">Chỉ đường</a>'
        + (pl.read ? '<a href="' + uRead(pl.read) + '" target="_blank" rel="noopener">Bài viết</a>' : '')
        + '</span></div>';
      extra.push(new maplibregl.Marker({ element:d })
        .setLngLat([pl.lng, pl.lat])
        .setPopup(new maplibregl.Popup({ offset:13, closeButton:false, maxWidth:'270px' }).setHTML(html))
        .addTo(map));
    });
  }
  // Khách sạn luôn hiện — không có nút bật/tắt, vì đây là chỗ ngủ mỗi đêm.
  (TRIP.hotels || []).forEach(h => {
    const d = document.createElement('div');
    d.className = 'htl' + (h.booked ? '' : ' soon');
    d.innerHTML = BED;
    d.title = h.name + ' · ' + h.nights;
    const html = '<div class="pop"><b>' + h.name + '</b>'
      + '<span class="pt">' + h.city + ' · ' + h.nights + '</span>'
      + (h.tip ? '<p>' + h.tip + '</p>' : '')
      + '<span class="pl"><a href="' + uNaver(h) + '" target="_blank" rel="noopener">Naver</a>'
      + '<a href="' + uKakaoTo(h) + '" target="_blank" rel="noopener">Chỉ đường</a></span></div>';
    extra.push(new maplibregl.Marker({ element:d })
      .setLngLat([h.lng, h.lat])
      .setPopup(new maplibregl.Popup({ offset:18, closeButton:false, maxWidth:'280px' }).setHTML(html))
      .addTo(map));
  });

  poiZoom();
  $$('#layerbar button').forEach(b => b.setAttribute('aria-pressed', state.layers[b.dataset.layer] ? 'true' : 'false'));
}

/* Bật "Địa điểm khác" thì hạ luôn ngưỡng zoom nhãn POI của nền,
   để chợ, chùa, quán hiện sớm hơn thay vì phải zoom sát z15-17. */
function poiZoom(){
  if (!map || !styleReady) return;
  const on = state.layers.places;
  [['poi_r1', on ? 13 : 15], ['poi_r7', on ? 15 : 16], ['poi_r20', on ? 16 : 17]].forEach(([id, z]) => {
    try{ if (map.getLayer(id)) map.setLayerZoomRange(id, z, 24); }catch(e){}
  });
}

function draw(which, opts){
  sel = which;
  if (!map || !styleReady) return;

  if (map.getSource('routes')) map.getSource('routes').setData(routeGeoJSON(sel));
  clearMarkers();
  if (curPopup){ curPopup.remove(); curPopup = null; }

  const b = new maplibregl.LngLatBounds();
  stopsFor(sel).forEach(day => {
    mapped(day).forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'pin';
      d.style.background = day.color;
      d.textContent = String(i+1);
      d.title = p.t + ' ' + p.name;
      d.addEventListener('click', ev => { ev.stopPropagation(); openStop(day.d, i, true); });
      markers[day.d + ':' + i] = new maplibregl.Marker({ element:d })
        .setLngLat([p.lng, p.lat]).addTo(map);
      b.extend([p.lng, p.lat]);
    });
    hotelLegs(day).forEach(l => { b.extend([l.a.lng, l.a.lat]); b.extend([l.b.lng, l.b.lat]); });
  });

  if (!b.isEmpty()){
    // duration phải > 0: fitBounds tức thời không kích hoạt chu trình xin tile,
    // nền sẽ trắng cho tới khi người dùng tự zoom. 200ms vẫn cho cảm giác tức thì.
    map.fitBounds(b, { padding: fitPad(), maxZoom: sel === 'all' ? 8.5 : 14,
                       duration: opts && opts.jump ? 200 : 700 });
  }
  $$('#daybar button').forEach(x => x.setAttribute('aria-pressed', x.dataset.day === String(sel) ? 'true' : 'false'));
  drawExtra();
  mapFoot();
}

function fitPad(){
  const mob = window.matchMedia('(max-width:820px)').matches;
  return mob ? { top:70, right:30, bottom:170, left:30 } : { top:70, right:60, bottom:70, left:60 };
}

function mapFoot(){
  const days = stopsFor(sel);
  const pts = days.reduce((s,d) => s + mapped(d).length, 0);
  const km  = days.reduce((s,d) => s + dayKm(d), 0);
  const hkm = days.reduce((s,d) => s + dayHotelKm(d), 0);
  const ks  = hkm > 0.15 ? ' · <b>' + km1(hkm) + '</b> đi/về KS' : '';
  el('mapsum').innerHTML = (sel === 'all' ? 'Cả chuyến' : days[0].dowFull + ' ' + days[0].date)
    + ' · <b>' + pts + '</b> điểm · <b>' + km1(km) + '</b> tham quan' + ks;
  const g = sel === 'all' ? null : uGoogleDay(days[0]);
  el('mapout').innerHTML = g ? '<a href="' + g + '" target="_blank" rel="noopener">Chỉ đường cả ngày</a>' : '';
}

function popHtml(day, s, i){
  return '<div class="pop"><b>' + s.name + '</b>'
    + '<span class="pt">' + day.dowFull + ' ' + day.date + ' · ' + s.t + ' · điểm ' + (i+1) + '</span>'
    + (s.tip ? '<p>' + s.tip + '</p>' : '')
    + '<span class="pl">'
    +   '<a href="' + uNaver(s) + '" target="_blank" rel="noopener">Naver</a>'
    +   '<a href="' + uKakaoTo(s) + '" target="_blank" rel="noopener">Chỉ đường</a>'
    +   (readQ(s) ? '<a href="' + uRead(readQ(s)) + '" target="_blank" rel="noopener">Bài viết</a>' : '')
    + '</span></div>';
}

/* mở một điểm: chọn ngày, bay tới, mở popup, mở dòng tương ứng trong sidebar */
function openStop(dayD, mi, fromMap){
  const day = TRIP.days.find(d => d.d === dayD);
  if (!day) return;
  const pts = mapped(day), p = pts[mi];
  if (!p) return;

  if (sel !== String(dayD)){ draw(String(dayD)); }

  const go = () => {
    const m = markers[dayD + ':' + mi];
    $$('.pin.sel').forEach(x => x.classList.remove('sel'));
    if (m) m.getElement().classList.add('sel');
    if (curPopup) curPopup.remove();
    curPopup = new maplibregl.Popup({ offset:18, closeButton:false, maxWidth:'270px' })
      .setLngLat([p.lng, p.lat]).setHTML(popHtml(day, p, mi)).addTo(map);
    map.easeTo({ center:[p.lng, p.lat], zoom: Math.max(map.getZoom(), 13), duration:500,
                 padding: fitPad() });
  };
  setTimeout(go, sel === String(dayD) ? 0 : 260);

  // mở dòng tương ứng trong sidebar
  const si = day.stops.indexOf(p);
  const row = el('s' + dayD + '-' + si);
  if (row){
    openDay(dayD, true);
    $$('.stop.open').forEach(x => { if (x !== row) x.classList.remove('open'); });
    row.classList.add('open');
    if (fromMap){
      switchTab('lich');
      if (isMobile()) setSheet('half');
      setTimeout(() => row.scrollIntoView({ behavior:'smooth', block:'center' }), 120);
      row.classList.add('hit');
      setTimeout(() => row.classList.remove('hit'), 1800);
    }
  }
}

function openDay(d, keep){
  $$('.day').forEach(x => {
    const on = +x.dataset.day === d;
    x.classList.toggle('sel', on);
    if (on) x.classList.add('open');
    else if (!keep) x.classList.remove('open');
  });
}

/* =====================================================================
   TẤM KÉO (MOBILE)
   ===================================================================== */
const isMobile = () => window.matchMedia('(max-width:820px)').matches;
let sheet = 'peek';
function setSheet(s){
  sheet = s;
  const side = el('side');
  side.style.transform = '';
  side.classList.remove('half','full');
  if (s !== 'peek') side.classList.add(s);
  setTimeout(() => { if (map) map.resize(); }, 320);
}
function initSheet(){
  const side = el('side'), grip = el('grip');
  let startY = 0, startT = 0, dragging = false, h = 0;

  const curT = () => {
    const m = new DOMMatrixReadOnly(getComputedStyle(side).transform);
    return m.m42 || 0;
  };
  grip.addEventListener('pointerdown', e => {
    if (!isMobile()) return;
    dragging = true; startY = e.clientY; startT = curT(); h = side.offsetHeight;
    side.classList.add('drag'); grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const t = Math.max(0, Math.min(h - 60, startT + (e.clientY - startY)));
    side.style.transform = 'translateY(' + t + 'px)';
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; side.classList.remove('drag');
    const t = curT(), H = side.offsetHeight;
    const snaps = { full:0, half:H*0.52, peek:H - 132 };
    let best = 'peek', bd = Infinity;
    for (const k in snaps){ const d = Math.abs(snaps[k] - t); if (d < bd){ bd = d; best = k; } }
    setSheet(best);
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('click', () => {
    if (!isMobile()) return;
    setSheet(sheet === 'peek' ? 'half' : sheet === 'half' ? 'full' : 'peek');
  });
}

/* =====================================================================
   TAB
   ===================================================================== */
function switchTab(name){
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
  $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === name));
}

/* =====================================================================
   SỰ KIỆN
   ===================================================================== */
function bind(){
  el('tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    switchTab(b.dataset.tab);
    if (isMobile() && sheet === 'peek') setSheet('half');
  });

  el('layerbar').addEventListener('click', e => {
    const b = e.target.closest('button[data-layer]');
    if (!b) return;
    const k = b.dataset.layer;
    state.layers[k] = !state.layers[k];
    drawExtra();
    queueSave();
  });

  el('daybar').addEventListener('click', e => {
    const b = e.target.closest('button[data-day]');
    if (!b) return;
    draw(b.dataset.day);
    if (b.dataset.day !== 'all') openDay(+b.dataset.day);
  });

  el('panes').addEventListener('click', e => {
    const dh = e.target.closest('[data-dayhead]');
    if (dh){
      const d = +dh.dataset.dayhead;
      const art = dh.closest('.day');
      const wasOpen = art.classList.contains('open');
      $$('.day').forEach(x => x.classList.remove('open','sel'));
      if (!wasOpen){ art.classList.add('open','sel'); draw(String(d)); }
      else { art.classList.remove('open'); }
      return;
    }
    const st = e.target.closest('.stop');
    if (st && !e.target.closest('a')){
      const wasOpen = st.classList.contains('open');
      $$('.stop.open').forEach(x => x.classList.remove('open'));
      if (!wasOpen) st.classList.add('open');
      if (st.dataset.mi != null) openStop(+st.dataset.day, +st.dataset.mi, false);
      return;
    }
    const rs = e.target.closest('#spend-reset');
    if (rs){
      if (!Object.keys(state.spend).length) return flash('Chưa có số nào để xoá');
      state.spend = {}; paintSpend(); paintTot(); save();
    }
  });

  document.addEventListener('change', e => {
    const b = e.target.closest('input[data-task]');
    if (b){
      state.checks[b.dataset.task] = b.checked;
      b.closest('.task').classList.toggle('done', b.checked);
      renderProgress(); queueSave();
    }
  });

  document.addEventListener('input', e => {
    const a = e.target.closest('textarea[data-note]');
    if (a){ state.notes[a.dataset.note] = a.value; queueSave(); return; }
    const sp = e.target.closest('input[data-spend]');
    if (sp){
      const d = +sp.dataset.spend;
      const v = sp.value.trim() === '' ? null : Number(sp.value);
      if (v === null || isNaN(v)) delete state.spend[d]; else state.spend[d] = v;
      paintSpend(); paintTot(); queueSave(); return;
    }
    const r = e.target.closest('#rate');
    if (r){
      const v = Number(r.value);
      if (v > 0){ state.rate = v; renderLich(); renderTien(); paintAll(); queueSave(); }
    }
  });

  window.addEventListener('resize', () => { if (map) map.resize(); });
}

function renderProgress(){
  const boxes = $$('input[data-task]');
  const p = el('prog'); if (!p) return;
  p.textContent = boxes.filter(b => b.checked).length + ' / ' + boxes.length + ' việc đã xong';
}
function paintAll(){
  $$('input[data-task]').forEach(b => {
    b.checked = !!state.checks[b.dataset.task];
    b.closest('.task').classList.toggle('done', b.checked);
  });
  $$('textarea[data-note]').forEach(a => {
    const v = state.notes[a.dataset.note];
    if (v){ a.value = v; const d = a.closest('details'); if (d) d.open = true; }
  });
  const r = el('rate'); if (r) r.value = state.rate;
  const sm = el('storage-mode'); if (sm) sm.textContent = LABELS[store.mode];
  paintSpend(); paintTot(); renderProgress();
}

/* --------------------------------------------- ngày mặc định -------- */
function defaultDay(){
  const now = new Date();
  const hit = TRIP.days.find(d => {
    const [dd, mm] = d.date.split('/').map(Number);
    return now.getFullYear() === 2026 && now.getMonth()+1 === mm && now.getDate() === dd;
  });
  return hit ? String(hit.d) : 'all';
}

/* =====================================================================
   CHẠY
   ===================================================================== */
el('h1').innerHTML = TRIP.city1 + ' <span class="sep">/</span> ' + TRIP.city2;
el('kick').textContent = TRIP.kicker;
el('daybar').innerHTML =
    '<button data-day="all" aria-pressed="true">Cả chuyến</button>'
  + TRIP.days.map(d => '<button data-day="' + d.d + '" aria-pressed="false">'
      + '<i style="background:' + d.color + '"></i>' + d.date + ' ' + d.short + '</button>').join('');

renderLich(); renderChuanBi(); renderTien(); renderLuuY();
bind(); initSheet(); paintAll();

if (window.maplibregl){
  map = new maplibregl.Map({
    container:'map', style:OFM, center:[128.2, 36.3], zoom:6.4,
    attributionControl:{ compact:true }
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'bottom-right');

  let failed = false;
  // 'style.load' bắn ngay khi style được phân tích xong — đủ để thêm layer và vẽ.
  // KHÔNG dùng 'load': sự kiện đó còn đợi tile của khung nhìn đầu tiên, có thể
  // không bao giờ tới nếu mạng chậm hoặc khung nhìn bị ẩn.
  const boot = () => {
    if (styleReady) return;
    styleReady = true;
    map.resize();
    addRouteLayer();
    // Đặt camera NGAY trong style.load thì MapLibre không kích hoạt chu trình xin
    // tile — nền trắng cho tới khi người dùng tự zoom. Đợi map vẽ xong khung hình
    // đầu tiên rồi mới fitBounds thì tile tải bình thường.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      draw(sel === 'all' ? defaultDay() : sel, { jump:true });
      setTimeout(() => { if (map) map.resize(); }, 400);
    }));
  };
  map.on('style.load', boot);

  function toFallback(why){
    if (failed) return;
    failed = true;
    styleReady = false;
    el('tiles-warn').classList.add('on');
    map.setStyle(FALLBACK);
    map.once('style.load', () => { addRouteLayer(); styleReady = true; draw(sel, { jump:true }); });
  }
  map.on('error', e => {
    // chỉ đổi nền khi CHÍNH style hỏng, không đổi vì một ô tile lẻ lỗi
    if (styleReady || failed) return;
    const msg = (e && e.error && e.error.message) || '';
    if (/style|sprite|glyph/i.test(msg)) toFallback(msg);
  });
  // lưới an toàn: 12 giây mà style vẫn chưa phân tích xong thì chuyển dự phòng
  setTimeout(() => { if (!styleReady) toFallback('quá hạn'); }, 12000);
} else {
  el('mapsum').textContent = 'Không tải được thư viện bản đồ.';
}

const dd = defaultDay();
if (dd !== 'all') openDay(+dd);

Promise.resolve().then(() => store.get())
  .then(raw => {
    if (!raw) return;
    const p = JSON.parse(raw);
    state.checks = p.checks || {};
    state.notes  = p.notes  || {};
    state.spend  = p.spend  || {};
    if (p.rate > 0) state.rate = p.rate;
    if (p.layers) state.layers = { stations:!!p.layers.stations, places:!!p.layers.places };
  })
  .catch(() => {})
  .then(() => { renderLich(); renderTien(); paintAll(); if (dd !== 'all') openDay(+dd); },
        () => paintAll());

})();
</script>
